<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PingDot popover mockup</title>
<!--
  Reference mockup for the new PingDot popover (direction "D": top half of A, bottom half of B).
  Open it in a browser. Click the dot in the fake menu bar to replay the open animation,
  use "Simulate state" to switch between healthy, unstable and offline.
  Data here is simulated. See SPEC.md for how each element maps to NetworkMonitor.State.
-->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#000000; --surface:#161616; --surface-hover:#1d1d1d; --hairline:rgba(255,255,255,.10);
  --text:#ffffff; --text-2:#b3b3b3; --text-3:#6b6b6b;
  --green:#00C076; --yellow:#FFB020; --red:#FF4D4D; --blue:#0A84FF;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#3a3e45;color:var(--text);font-family:'Manrope',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"lnum" 1}
button{font-family:inherit}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.menubar{position:fixed;top:0;left:0;right:0;height:30px;background:rgba(18,18,20,.72);display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 12px;color:#f2f2f2;font-size:13px;font-weight:600}
.mb{border:0;background:none;color:inherit;display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.mb:hover{background:rgba(255,255,255,.14)}
.mbdot{width:10px;height:10px;border-radius:50%;transition:background .4s ease}

.anchor{position:fixed;top:40px;right:22px;width:380px}
.anchor[hidden]{display:none}
.nub{position:absolute;top:-6px;right:160px;width:14px;height:14px;background:var(--stage);transform:rotate(45deg);border-radius:3px;border-top:1px solid var(--hairline);border-left:1px solid var(--hairline)}
.popover{position:relative;background:var(--stage);border-radius:24px;border:1px solid var(--hairline);box-shadow:0 30px 80px rgba(0,0,0,.55);padding:22px 20px 20px}

/* motion */
@keyframes pop{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
@keyframes halo{0%{transform:scale(.4);opacity:.5}100%{transform:scale(1.7);opacity:0}}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}
.open .anchor{animation:pop 320ms cubic-bezier(.2,.8,.2,1) both;transform-origin:72% 0}
.open .rise{animation:rise 440ms cubic-bezier(.2,.8,.2,1) both}
.open .spark{animation:draw 1200ms cubic-bezier(.2,.8,.2,1) both}
.live{position:relative;display:block;width:8px;height:8px;border-radius:50%;transition:background .4s ease}
.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;animation:ping 1.6s ease-out infinite}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}

/* top half (from A) */
.row{display:flex;align-items:center;justify-content:space-between}
.status{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--text-2)}
.ib{width:36px;height:36px;border-radius:999px;border:0;background:var(--surface);color:var(--text-2);display:grid;place-items:center;cursor:pointer;transition:background .15s ease,color .15s ease,transform .12s ease}
.ib:hover{background:#222;color:#fff}
.ib:active{transform:scale(.97)}
.hero{margin-top:22px;display:flex;align-items:baseline;gap:8px}
.big{font-size:84px;font-weight:700;letter-spacing:-0.045em;line-height:.9}
.unit{font-size:22px;font-weight:600;color:var(--text-3)}
.headline{font-size:17px;font-weight:700;margin-top:14px}
.cause{font-size:13px;color:var(--text-2);margin-top:4px;line-height:1.45;min-height:19px}
.chart{margin-top:20px;position:relative}
.chart svg{display:block;overflow:visible}
.base{stroke:rgba(255,255,255,.08);stroke-width:1}
.spark{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:2000;transition:stroke .4s ease}
.maxlabel{position:absolute;top:0;left:0;font-size:11px;color:var(--text-3);font-weight:600}
.tabs{display:flex;gap:16px}
.tab{border:0;background:none;padding:4px 0;font-size:13px;cursor:pointer;color:var(--text-3);font-weight:500;transition:color .15s ease}
.tab:hover,.tab.on{color:#fff}
.tab.on{font-weight:700}
.label{font-size:12px;color:var(--text-3);font-weight:600}

/* bottom half (from B) */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px;transition:background .15s ease}
.tile:hover{background:var(--surface-hover)}
.thead{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text-3)}
.tms{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-top:8px}
.bars{display:flex;gap:3px;align-items:flex-end;height:28px;margin-top:10px}
.bars span{display:block;flex:1;border-radius:2px;transition:height .35s cubic-bezier(.2,.8,.2,1),background .3s ease}
.tloss{font-size:12px;font-weight:600;margin-top:8px}
.dtile{display:flex;align-items:center;gap:12px}
.dicon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;transition:background .4s ease,color .4s ease}
.dval{font-size:14px;font-weight:700}
.pill{width:100%;height:46px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:14px;border:0;box-shadow:0 8px 30px rgba(0,0,0,.55);cursor:pointer;transition:filter .15s ease,transform .12s ease}
.pill:hover{filter:brightness(.92)}
.pill:active{transform:scale(.97)}

.sim{position:fixed;left:20px;bottom:20px;display:flex;align-items:center;gap:10px}
.sim span{font-size:12px;color:rgba(255,255,255,.7);font-weight:600}
.segs{display:flex;background:rgba(0,0,0,.45);border-radius:999px;padding:3px}
.seg{border:0;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:rgba(255,255,255,.75);transition:background .2s ease,color .2s ease}
.seg.on{background:#fff;color:#000}
</style>
</head>
<body class="open">

<div class="menubar">
  <button class="mb" id="mbBtn" aria-label="Open PingDot"><span class="mbdot" id="mbDot"></span><span id="mbMs"></span></button>
  <span>Tue 13 Oct 18:45</span>
</div>

<div class="anchor" id="anchor">
  <div class="nub"></div>
  <div class="popover">

    <div class="row">
      <div class="status">
        <span class="live" id="liveDot"></span>
        <span id="statusWord" style="color:#fff"></span>
        <span style="color:#3a3a3a">·</span>
        <span id="iface" style="color:var(--text-3)"></span>
      </div>
      <button class="ib" aria-label="Settings">
        <svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>

    <div class="hero rise" style="animation-delay:60ms"><span class="big" id="bigNum"></span><span class="unit" id="bigUnit"></span></div>
    <div class="headline rise" style="animation-delay:100ms" id="headline"></div>
    <div class="cause rise" style="animation-delay:120ms" id="cause"></div>

    <div class="chart rise" style="animation-delay:160ms">
      <svg width="338" height="96" viewBox="0 0 338 96" aria-hidden="true">
        <line class="base" x1="0" y1="90.5" x2="338" y2="90.5"/>
        <path class="spark" id="spark"/>
        <circle class="halo" id="halo" r="9"/>
        <circle id="endDot" r="3.5"/>
      </svg>
      <div class="maxlabel" id="maxLabel"></div>
    </div>

    <div class="row" style="margin-top:12px">
      <span class="label">Latency, best reply</span>
      <div class="tabs" id="tabs">
        <button class="tab" data-n="20">20 s</button>
        <button class="tab" data-n="40">40 s</button>
        <button class="tab on" data-n="60">1 min</button>
      </div>
    </div>

    <div class="grid2 rise" style="animation-delay:220ms;margin-top:20px" id="targets"></div>

    <div class="grid2 rise" style="animation-delay:280ms;margin-top:10px">
      <div class="tile dtile"><span class="dicon" id="dWifi"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><path d="M12 19.5h.01"/></svg></span><div><div class="label">Network</div><div class="dval" id="vWifi"></div></div></div>
      <div class="tile dtile"><span class="dicon" id="dRouter"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01"/><path d="M15 13V8"/><path d="M12 6a4.5 4.5 0 0 1 6 0"/></svg></span><div><div class="label">Router</div><div class="dval" id="vRouter"></div></div></div>
      <div class="tile dtile"><span class="dicon" id="dDns"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span><div><div class="label">DNS</div><div class="dval" id="vDns"></div></div></div>
      <div class="tile dtile"><span class="dicon" id="dHttps"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span><div><div class="label">HTTPS</div><div class="dval" id="vHttps"></div></div></div>
    </div>

    <div class="rise" style="animation-delay:340ms;margin-top:16px">
      <button class="pill" id="copyBtn">Copy diagnostics</button>
    </div>

  </div>
</div>

<div class="sim">
  <span>Simulate state</span>
  <div class="segs" id="segs">
    <button class="seg on" data-m="ok">Healthy</button>
    <button class="seg" data-m="warn">Unstable</button>
    <button class="seg" data-m="down">Offline</button>
  </div>
</div>

<script>
(() => {
  const C = { ok: '#00C076', warn: '#FFB020', down: '#FF4D4D' };
  const RGB = { '#00C076': '0,192,118', '#FFB020': '255,176,32', '#FF4D4D': '255,77,77' };
  const GREY = '#6b6b6b';
  const S = { mode: 'ok', h1: [], h2: [], downSecs: 0, range: 60, open: true };
  const $ = id => document.getElementById(id);

  function sample(mode, base) {
    if (mode === 'down') return null;
    if (mode === 'warn') return Math.random() < 0.28 ? null : Math.round(40 + Math.random() * 140);
    let v = base + Math.random() * 6;
    if (Math.random() < 0.07) v += 10 + Math.random() * 12;
    return Math.round(v);
  }
  for (let i = 0; i < 60; i++) { S.h1.push(sample('ok', 11)); S.h2.push(sample('ok', 14)); }

  function lastNonNull(a) { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; }

  function targetTile(name, ip, hist) {
    const h = hist.slice(-16), rec = h.filter(v => v != null);
    const loss = Math.round((h.length - rec.length) / h.length * 100);
    const avg = rec.length ? Math.round(rec.reduce((a, b) => a + b, 0) / rec.length) : null;
    const mx = Math.max(30, rec.length ? Math.max(...rec) : 30);
    const bars = h.map(v => `<span style="height:${v == null ? 4 : Math.round(8 + v / mx * 20)}px;background:${v == null ? C.down : 'rgba(255,255,255,.85)'}"></span>`).join('');
    const lossColor = loss === 0 ? GREY : (loss > 50 ? C.down : C.warn);
    return `<div class="tile"><div class="thead"><span>${name}</span><span>${ip}</span></div>
      <div class="tms">${avg == null ? 'no reply' : avg + ' ms'}</div>
      <div class="bars">${bars}</div>
      <div class="tloss" style="color:${lossColor}">${loss === 0 ? 'no loss' : loss + ' % loss'}</div></div>`;
  }

  function diag(id, valId, text, col) {
    $(valId).textContent = text;
    $(id).style.color = col;
    $(id).style.background = col === GREY ? 'rgba(255,255,255,.06)' : `rgba(${RGB[col]},.14)`;
  }

  function render() {
    const c = C[S.mode], down = S.mode === 'down';
    const n = S.range, a = S.h1.slice(-n), b = S.h2.slice(-n);
    const best = a.map((v, i) => v == null ? b[i] : (b[i] == null ? v : Math.min(v, b[i])));
    const vals = best.filter(v => v != null);
    const W = 338, H = 96, top = Math.max(40, vals.length ? Math.max(...vals) : 40) * 1.15;
    let d = '', pen = false, ex = W - 4, ey = H - 6;
    best.forEach((v, i) => {
      const x = 4 + i * (W - 8) / (n - 1);
      if (v == null) { pen = false; return; }
      const y = H - 6 - v / top * (H - 18);
      d += (pen ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
      pen = true; ex = x; ey = y;
    });
    if (!vals.length) d = `M4 ${H - 6} L${W - 4} ${H - 6}`;
    if (best[best.length - 1] == null) { ex = W - 4; ey = H - 6; }
    const latest = lastNonNull(best);

    const spark = $('spark');
    spark.setAttribute('d', d);
    spark.style.stroke = c;
    spark.style.strokeDasharray = vals.length ? '2000' : '3 6';
    for (const id of ['halo', 'endDot']) { $(id).setAttribute('cx', ex); $(id).setAttribute('cy', ey); $(id).style.fill = c; }
    $('maxLabel').textContent = Math.round(top) + ' ms';

    const text = {
      ok: ['Online', 'Internet OK', ''],
      warn: ['Unstable', 'DNS is failing', "Websites won't load, but ping gets through"],
      down: ['Offline', 'Internet down for ' + S.downSecs + ' s', 'Wi‑Fi is off or the cable is unplugged']
    }[S.mode];
    $('mbDot').style.background = c;
    $('mbMs').textContent = down ? '' : (latest == null ? '' : latest + ' ms');
    $('liveDot').style.background = c;
    $('statusWord').textContent = text[0];
    $('iface').textContent = down ? 'no network' : 'en0';
    $('bigNum').textContent = down ? S.downSecs : (latest == null ? '0' : latest);
    $('bigUnit').textContent = down ? 's down' : 'ms';
    $('headline').textContent = text[1];
    $('cause').textContent = text[2];

    $('targets').innerHTML = targetTile('Cloudflare', '1.1.1.1', S.h1) + targetTile('Google', '8.8.8.8', S.h2);

    const G = C.ok, Y = C.warn, R = C.down;
    const D = {
      ok: [['en0', G], ['2 ms', G], ['OK', G], ['OK', G]],
      warn: [['en0', G], ['3 ms', G], ['Failing', Y], ['OK', G]],
      down: [['Off', R], ['Unreachable', R], ['…', GREY], ['…', GREY]]
    }[S.mode];
    diag('dWifi', 'vWifi', ...D[0]); diag('dRouter', 'vRouter', ...D[1]); diag('dDns', 'vDns', ...D[2]); diag('dHttps', 'vHttps', ...D[3]);
  }

  function tick() {
    S.h1 = S.h1.concat([sample(S.mode, 11)]).slice(-60);
    S.h2 = S.h2.concat([sample(S.mode, 14)]).slice(-60);
    S.downSecs = S.mode === 'down' ? S.downSecs + 1 : 0;
    render();
  }

  $('mbBtn').onclick = () => {
    S.open = !S.open;
    $('anchor').hidden = !S.open;
    document.body.classList.remove('open');
    if (S.open) { void document.body.offsetWidth; document.body.classList.add('open'); }
  };
  $('tabs').onclick = e => {
    const t = e.target.closest('.tab'); if (!t) return;
    S.range = +t.dataset.n;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
    render();
  };
  $('segs').onclick = e => {
    const t = e.target.closest('.seg'); if (!t) return;
    S.mode = t.dataset.m; S.downSecs = 0;
    document.querySelectorAll('.seg').forEach(x => x.classList.toggle('on', x === t));
    render();
  };
  let copyT;
  $('copyBtn').onclick = () => {
    $('copyBtn').textContent = 'Copied';
    clearTimeout(copyT); copyT = setTimeout(() => $('copyBtn').textContent = 'Copy diagnostics', 1600);
  };

  render();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
